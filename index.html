<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · iQMS</title>
  <meta name="description" content="iQMS — process-centred quality management workspace (UX mock, sample data).">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <aside class="sb" id="sidebar" aria-label="Main navigation">
    <div class="sb-top">
      <div class="org-mark" id="orgMark" aria-hidden="true">HS</div>
      <div class="org-name"><b id="orgName">Organization</b><span id="orgMeta">QMS workspace</span></div>
      <button class="sb-pin" id="sbPin" type="button" aria-pressed="false" aria-label="Pin sidebar" title="Pin sidebar"><i data-lucide="pin"></i></button>
    </div>
    <nav class="sb-scroll" id="sbNav"></nav>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"><i data-lucide="menu"></i></button>
      <div class="search" id="search">
        <label class="search-box">
          <i data-lucide="search"></i>
          <span class="sr-only">Search processes, documents, risks, KPIs, evidence and findings</span>
          <input id="searchInput" type="search" placeholder="Search processes, documents, risks, KPIs, evidence…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list">
          <span class="kbd" aria-hidden="true">Ctrl K</span>
        </label>
        <div class="search-results" id="searchResults" role="listbox" hidden></div>
      </div>
      <div class="topbar-right">
        <span class="sample-tag" title="All records in this mock are fictional sample data">Sample data</span>
        <button class="icon-btn" type="button" aria-label="Help" data-action="toast" data-title="Help" data-msg="Help centre is not part of this mock."><i data-lucide="circle-help"></i></button>
        <button class="icon-btn" type="button" aria-label="Notifications" data-action="toast" data-title="Notifications" data-msg="Assigned items appear under Documents in Review and on the Overview."><i data-lucide="bell"></i></button>
        <button class="user-chip" type="button" data-action="toast" data-title="Account" data-msg="Profile settings are not part of this mock."><span class="avatar" id="meAvatar">MS</span><span class="who"><b id="meName">User</b><span id="meTitle"></span></span></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="modalHost"></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script src="vendor/lucide.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/saved-views.js"></script>
  <script src="assets/documents.js"></script>
  <script src="assets/views.js"></script>
  <script src="assets/pages.js"></script>
  <script src="assets/qms.js"></script>
  <script src="assets/admin.js"></script>
  <script>Q.boot();</script>
</body>
</html>
